[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
python_files = ["test_*.py"]
pythonpath = [
  "services/ingestion-worker/src",
  "services/prediction-api/src",
  "services/settlement-worker/src",
]
testpaths = [
  "services/ingestion-worker/tests",
  "services/prediction-api/tests",
  "services/settlement-worker/tests",
]

[tool.ruff]
line-length = 88
src = [
  "services/ingestion-worker/src",
  "services/prediction-api/src",
  "services/settlement-worker/src",
]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PTH", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
